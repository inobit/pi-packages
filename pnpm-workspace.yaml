packages:
  - "packages/*"

# 跨包链接需显式使用 workspace: 协议
linkWorkspacePackages: false

# 允许执行构建脚本的依赖（pnpm 11 默认忽略构建脚本）
onlyBuiltDependencies:
  - "@google/genai"
  - protobufjs

# 集中管理各包共享依赖版本
catalog:
  typescript: "^7.0.0"
  "@types/node": "^24.0.0"
  "@earendil-works/pi-ai": "0.84.2"
  "@earendil-works/pi-coding-agent": "0.84.2"
  "@earendil-works/pi-tui": "0.84.2"
  typebox: "1.3.7"

allowBuilds:
  '@google/genai': true
  # 保持既有行为：esbuild 的构建脚本不执行（平台二进制由 optionalDependencies 提供）
  esbuild: false
  protobufjs: true

# pnpm 11 安装时自动写入：0.86.0 系列早于 pnpm 内置发布龄策略（本项目未显式配置 minimumReleaseAge）。
# 保留以保证换机器/CI 安装结果一致；若未来无需再装这些版本，可整段删除。
minimumReleaseAgeExclude:
  - '@earendil-works/chord@0.86.0'
  - '@earendil-works/pi-agent-core@0.86.0'
  - '@earendil-works/pi-ai@0.86.0'
  - '@earendil-works/pi-coding-agent@0.86.0'
  - '@earendil-works/pi-telemetry@0.86.0'
  - '@earendil-works/pi-tui@0.86.0'
